{% extends "base.html" %}

{% block title %}Зміна пароля{% endblock %}

{% block content %}
<main class="account-page-wrapper">
  <div class="account-container">
    <div class="account-form-container">
      <h2 class="account-form-title">Зміна пароля</h2>

      <form method="post" novalidate>
        {% csrf_token %}

        {% include "partials/form_errors.html" with form=form %}

        <div class="checkout-form-group">
          <label for="{{ form.old_password.id_for_label }}">
            Поточний пароль
          </label>
          {{ form.old_password }}
        </div>

        <div class="checkout-form-group">
          <label for="{{ form.new_password1.id_for_label }}">
            Новий пароль
          </label>
          {{ form.new_password1 }}
        </div>

        <div class="checkout-form-group">
          <label for="{{ form.new_password2.id_for_label }}">
            Підтвердження нового пароля
          </label>
          {{ form.new_password2 }}
        </div>

        <button
          type="submit"
          class="button button--primary button--full-width"
        >
          Змінити пароль
        </button>
      </form>

      <a
        href="{% url 'accounts:profile' %}"
        class="button button--secondary button--full-width"
      >
        Повернутися до кабінету
      </a>
    </div>
  </div>
</main>
{% endblock %}
